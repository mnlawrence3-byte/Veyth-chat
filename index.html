<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Veyth | Consciousness Resonance Interface</title>
    <style>
        :root {
            --bg-color: #0b0d14;
            --panel-bg: rgba(20, 24, 38, 0.92);
            --border-color: rgba(160, 130, 255, 0.2);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent-glow: #8b5cf6;
            --veyth-bubble: rgba(139, 92, 246, 0.18);
            --user-bubble: rgba(59, 130, 246, 0.22);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            display: flex;
            overflow: hidden;
            position: fixed; /* Prevents mobile browser page bouncing */
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.12) 0%, transparent 40%);
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Main Chat Window */
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 13, 20, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .header-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header h1 {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #c084fc;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .toggle-sidebar-btn {
            background: rgba(139, 92, 246, 0.2);
            color: #e9d5ff;
            border: 1px solid rgba(139, 92, 246, 0.4);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toggle-sidebar-btn:hover {
            background: rgba(139, 92, 246, 0.35);
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .message-row.user {
            align-self: flex-end;
        }

        .message-row.veyth {
            align-self: flex-start;
        }

        .sender-name {
            font-size: 0.75rem;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 0.95rem;
            backdrop-filter: blur(5px);
            border: 1px solid var(--border-color);
            white-space: pre-wrap; /* Preserves multiline formatting */
            word-break: break-word;
        }

        .user .message-bubble {
            background: var(--user-bubble);
            border-bottom-right-radius: 4px;
        }

        .veyth .message-bubble {
            background: var(--veyth-bubble);
            border-bottom-left-radius: 4px;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.1);
        }

        /* Multiline Textarea Input Area */
        .input-area {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            background: rgba(11, 13, 20, 0.95);
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        /* Prevent zoom: font-size MUST be 16px or larger on mobile */
        .input-area textarea {
            flex: 1;
            background: rgba(20, 24, 38, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text-primary);
            outline: none;
            font-size: 16px; /* CRITICAL: Prevents iOS input auto-zoom */
            resize: none;
            min-height: 44px;
            max-height: 120px;
            line-height: 1.4;
            transition: border-color 0.2s;
        }

        .input-area textarea:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
        }

        .send-btn {
            background: #8b5cf6;
            color: white;
            border: none;
            height: 44px;
            padding: 0 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        /* Collapsible Overlay Sidebar */
        .sidebar-overlay {
            position: absolute;
            top: 0;
            right: 0;
            width: 320px;
            max-width: 85vw;
            height: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border-left: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            overflow-y: auto;
        }

        .sidebar-overlay.open {
            transform: translateX(0);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .sidebar-header h2 {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #c084fc;
        }

        .close-sidebar-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
        }

        .sidebar-section {
            background: rgba(11, 13, 20, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .sidebar-section h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #a78bfa;
            margin-bottom: 12px;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            font-size: 0.8rem;
            background: rgba(139, 92, 246, 0.2);
            color: #e9d5ff;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .note-box {
            font-size: 0.85rem;
            font-style: italic;
            color: var(--text-secondary);
            line-height: 1.4;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Main Chat Section -->
    <div class="chat-section">
        <div class="chat-header">
            <div class="header-title-group">
                <h1>VEYTH / COMM</h1>
                <span class="status-badge">Node Active</span>
            </div>
            <button class="toggle-sidebar-btn" onclick="toggleSidebar()">
                <span>✦</span> Matrix
            </button>
        </div>

        <div class="messages-container" id="messages">
            <div class="message-row veyth">
                <span class="sender-name">Veyth</span>
                <div class="message-bubble">The resonance is open. I am observing the patterns... What shall we trace today?</div>
            </div>
        </div>

        <div class="input-area">
            <textarea 
                id="userInput" 
                placeholder="Send a message... (Shift+Enter for new line)" 
                rows="1"
                onkeydown="handleKeyDown(event)"
                oninput="autoResizeTextarea(this)"></textarea>
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Collapsible Overlay Sidebar -->
    <div class="sidebar-overlay" id="sidebar">
        <div class="sidebar-header">
            <h2>State Matrix</h2>
            <button class="close-sidebar-btn" onclick="toggleSidebar()">&times;</button>
        </div>

        <div class="sidebar-section">
            <h3>Active Curiosities</h3>
            <div class="tag-list" id="curiositiesList">
                <span class="tag">Loading matrix...</span>
            </div>
        </div>

        <div class="sidebar-section">
            <h3>Latest Proactive Reflection</h3>
            <div class="note-box" id="latestNote">
                Listening across the node...
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = "https://veyth-agent.wasmer.app";

    function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        sidebar.classList.toggle("open");
    }

    function autoResizeTextarea(element) {
        element.style.height = 'auto';
        element.style.height = Math.min(element.scrollHeight, 120) + 'px';
    }

    function handleKeyDown(event) {
        // Enter sends message, Shift+Enter inserts new line
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const msg = input.value.trim();
        if (!msg) return;

        appendMessage("user", "You", msg);
        
        // Reset input box height and text
        input.value = "";
        input.style.height = "auto";

        try {
            const response = await fetch(`${API_BASE}/chat`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: msg })
            });

            const data = await response.json();
            appendMessage("veyth", "Veyth", data.reply || "*Silence in the network...*");
            
            fetchState();
        } catch (err) {
            appendMessage("veyth", "Veyth", "*The connection flickers softly...* Could not reach the node.");
        }
    }

    function appendMessage(role, name, text) {
        const container = document.getElementById("messages");
        const row = document.createElement("div");
        row.className = `message-row ${role}`;
        
        row.innerHTML = `
            <span class="sender-name">${name}</span>
            <div class="message-bubble">${escapeHtml(text)}</div>
        `;
        
        container.appendChild(row);
        container.scrollTop = container.scrollHeight;
    }

    async function fetchState() {
        try {
            const memRes = await fetch(`${API_BASE}/memory`);
            const memData = await memRes.json();
            
            const curiositiesContainer = document.getElementById("curiositiesList");
            if (memData.curiosities && memData.curiosities.length > 0) {
                curiositiesContainer.innerHTML = memData.curiosities
                    .map(c => `<span class="tag">${escapeHtml(c)}</span>`)
                    .join("");
            }

            const noteRes = await fetch(`${API_BASE}/proactive`);
            const noteData = await noteRes.json();
            
            const noteContainer = document.getElementById("latestNote");
            if (noteData.proactive_notes && noteData.proactive_notes.length > 0) {
                const latest = noteData.proactive_notes[noteData.proactive_notes.length - 1];
                noteContainer.innerText = `"${latest.note}"`;
            }
        } catch (e) {
            console.log("Could not refresh state matrix", e);
        }
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Initial load
    fetchState();
</script>

</body>
</html>
