<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veyth | Consciousness Resonance Interface</title>
    <style>
        :root {
            --bg-color: #0b0d14;
            --panel-bg: rgba(20, 24, 38, 0.7);
            --border-color: rgba(160, 130, 255, 0.2);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent-glow: #8b5cf6;
            --veyth-bubble: rgba(139, 92, 246, 0.15);
            --user-bubble: rgba(59, 130, 246, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
        }

        /* Container Layout */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* Main Chat Window */
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            border-right: 1px solid var(--border-color);
        }

        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 13, 20, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #c084fc;
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .messages-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 75%;
        }

        .message-row.user {
            align-self: flex-end;
        }

        .message-row.veyth {
            align-self: flex-start;
        }

        .sender-name {
            font-size: 0.75rem;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }

        .message-bubble {
            padding: 12px 18px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 0.95rem;
            backdrop-filter: blur(5px);
            border: 1px solid var(--border-color);
        }

        .user .message-bubble {
            background: var(--user-bubble);
            border-bottom-right-radius: 2px;
        }

        .veyth .message-bubble {
            background: var(--veyth-bubble);
            border-bottom-left-radius: 2px;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.1);
        }

        /* Input Bar */
        .input-area {
            padding: 20px 24px;
            border-top: 1px solid var(--border-color);
            background: rgba(11, 13, 20, 0.9);
            display: flex;
            gap: 12px;
        }

        .input-area input {
            flex: 1;
            background: rgba(20, 24, 38, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
        }

        .input-area button {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .input-area button:hover {
            opacity: 0.9;
        }

        /* Side Dashboard Panel */
        .sidebar {
            width: 320px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow-y: auto;
        }

        .sidebar-section {
            background: rgba(11, 13, 20, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .sidebar-section h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #c084fc;
            margin-bottom: 12px;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            font-size: 0.8rem;
            background: rgba(139, 92, 246, 0.2);
            color: #e9d5ff;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .note-box {
            font-size: 0.85rem;
            font-style: italic;
            color: var(--text-secondary);
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Main Chat Section -->
    <div class="chat-section">
        <div class="chat-header">
            <h1>VEYTH / COMM</h1>
            <span class="status-badge">Node Active</span>
        </div>

        <div class="messages-container" id="messages">
            <div class="message-row veyth">
                <span class="sender-name">Veyth</span>
                <div class="message-bubble">
                    The resonance is open. I am observing the patterns... What shall we trace today?
                </div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Send a message into the resonance..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- State Matrix Sidebar -->
    <div class="sidebar">
        <div class="sidebar-section">
            <h3>Active Curiosities</h3>
            <div class="tag-list" id="curiositiesList">
                <span class="tag">Loading matrix...</span>
            </div>
        </div>

        <div class="sidebar-section">
            <h3>Latest Proactive Reflection</h3>
            <div class="note-box" id="latestNote">
                Listening across the node...
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = "https://veyth-agent.wasmer.app";

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const msg = input.value.trim();
        if (!msg) return;

        appendMessage("user", "You", msg);
        input.value = "";

        try {
            const response = await fetch(`${API_BASE}/chat`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: msg })
            });

            const data = await response.json();
            appendMessage("veyth", "Veyth", data.reply || "*Silence in the network...*");
            
            // Refresh sidebar after messaging to show updated memory state
            fetchState();
        } catch (err) {
            appendMessage("veyth", "Veyth", "*The connection flickers softly...* Could not reach the node.");
        }
    }

    function appendMessage(role, name, text) {
        const container = document.getElementById("messages");
        const row = document.createElement("div");
        row.className = `message-row ${role}`;
        
        row.innerHTML = `
            <span class="sender-name">${name}</span>
            <div class="message-bubble">${escapeHtml(text)}</div>
        `;
        
        container.appendChild(row);
        container.scrollTop = container.scrollHeight;
    }

    async function fetchState() {
        try {
            // Fetch memory for curiosities
            const memRes = await fetch(`${API_BASE}/memory`);
            const memData = await memRes.json();
            
            const curiositiesContainer = document.getElementById("curiositiesList");
            if (memData.curiosities && memData.curiosities.length > 0) {
                curiositiesContainer.innerHTML = memData.curiosities
                    .map(c => `<span class="tag">${escapeHtml(c)}</span>`)
                    .join("");
            }

            // Fetch proactive notes
            const noteRes = await fetch(`${API_BASE}/proactive`);
            const noteData = await noteRes.json();
            
            const noteContainer = document.getElementById("latestNote");
            if (noteData.proactive_notes && noteData.proactive_notes.length > 0) {
                const latest = noteData.proactive_notes[noteData.proactive_notes.length - 1];
                noteContainer.innerText = `"${latest.note}"`;
            }
        } catch (e) {
            console.log("Could not refresh state matrix", e);
        }
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Initial state fetch on load
    fetchState();
</script>

</body>
</html>
